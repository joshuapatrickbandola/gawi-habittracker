<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Loading...</title>
</head>
<body>
    <div class="spinner"></div>
    <p id="msg">Waking up the server, this can take up to a minute...</p>
    <script>
        const APP_URL = "https://gawi-habittracker.onrender.com";
        const HEALTH_URL = APP_URL + "/health/";
        let attempts = 0;

        async function wake() {
        attempts++;
        try {
            const res = await fetch(HEALTH_URL, { cache: "no-store" });
            if (res.ok) {
            window.location.href = APP_URL + window.location.search;
            return;
            }
        } catch (e) {
            // still waking up or network hiccup, just retry
        }

        if (attempts > 10) {
            document.getElementById("msg").textContent =
            "Still waking up... hang tight, this can occasionally take a bit longer.";
        }

        setTimeout(wake, 2000);
        }

        wake();
    </script>
</body>
</html>
