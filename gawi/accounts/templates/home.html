{% extends "base.html" %}

{% block main %}
{% if user.is_authenticated %}
    <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
    </form>
{% else %}
    <a href="{% url 'account_login' %}">Log in</a>
{% endif %}
{% endblock %}
