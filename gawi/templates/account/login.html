{% extends "base.html" %}
{% load socialaccount %}

{% block main %}
<div class="login-container">

    <h1>Welcome back</h1>

    <p>
        Don't have an account?
        <a href="{% url 'account_signup' %}">
            Sign up
        </a>
    </p>


    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}

        <div>
            <label>Email</label>
            {{ form.login }}
        </div>


        <div>
            <label>Password</label>
            {{ form.password }}
        </div>


        <div>
            {{ form.remember }}
            <label>
                Remember me
            </label>
        </div>


        <a href="{% url 'account_reset_password' %}">
            Forgot password?
        </a>


        <button type="submit">
            Sign In
        </button>

    </form>


    <hr>

    <p>
        Or continue with
    </p>

    <a href="{% provider_login_url 'google' %}?next={% url 'accounts:post_login' %}">
        Continue with Google
    </a>

</div>
{% endblock %}
