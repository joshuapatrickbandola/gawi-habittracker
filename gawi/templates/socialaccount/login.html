{% extends "base.html" %}

{% load i18n %}
{% block main %}
<div class="auth-card">
    <h1>Continue with Google</h1>

    <p>
        You are about to sign in using your Google account.
    </p>

    <form method="post">
        {% csrf_token %}

        {% if redirect_field_value %}
            <input
                type="hidden"
                name="{{ redirect_field_name }}"
                value="{{ redirect_field_value }}"
            >
        {% endif %}

        <button type="submit">
            Continue with Google
        </button>
    </form>

    <p>
        <a href="{% url 'account_login' %}">
            Cancel
        </a>
    </p>
</div>
{% endblock %}
